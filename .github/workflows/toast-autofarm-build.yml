name: Build Toast AutoFarm 1.21.11

on:
  push:
    branches:
      - toast-autofarm-1.21.11-build
    paths:
      - "ToastAutoFarm-1.21.11/**"
      - ".github/workflows/toast-autofarm-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Build mod
        working-directory: ToastAutoFarm-1.21.11
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload remapped mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: ToastAutoFarm-1.21.11
          path: ToastAutoFarm-1.21.11/build/libs/toast-autofarm-1.21.11-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
